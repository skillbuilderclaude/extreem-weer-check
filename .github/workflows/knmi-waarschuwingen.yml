name: KNMI-waarschuwingen ophalen

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knmi-waarschuwingen
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Waarschuwingen ophalen
        run: python knmi.py
      - name: Wijziging vastleggen
        run: |
          if [ -n "$(git status --porcelain warnings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add warnings.json
            git commit -m "KNMI-waarschuwingen bijgewerkt"
            git push
          fi
